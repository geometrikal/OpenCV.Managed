name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Geometrikal.OpenCV.Managed.slnx -c Release

      - name: Test
        run: dotnet test src/Geometrikal.OpenCV.Managed.Tests/Geometrikal.OpenCV.Managed.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory ./test-results

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          [xml]$trx = Get-Content ./test-results/results.trx
          $failed = $trx.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed'
          $groups = $failed | Group-Object { ($_.testName -split '\(')[0] -replace '^.*\.Tests\.', '' } | Sort-Object Count -Descending
          $summary = ($groups | ForEach-Object { "$($_.Count) $($_.Name)" }) -join '%0A'
          Write-Output "::error title=$($failed.Count) failed tests::$summary"
          $groups | Select-Object -First 9 | ForEach-Object {
            $r = $_.Group[0]
            $msg = ($r.Output.ErrorInfo.Message -replace '\r?\n', '%0A')
            if ($msg.Length -gt 1500) { $msg = $msg.Substring(0, 1500) }
            Write-Output "::error title=$($r.testName)::$msg"
          }
          Write-Output "::notice title=Environment::$([System.Runtime.InteropServices.RuntimeInformation]::FrameworkDescription), $env:NUMBER_OF_PROCESSORS cores, $((Get-CimInstance Win32_Processor).Name)"

      - name: Pack
        run: dotnet pack src/Geometrikal.OpenCV.Managed/Geometrikal.OpenCV.Managed.csproj -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*
