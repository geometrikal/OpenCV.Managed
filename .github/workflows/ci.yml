name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Geometrikal.OpenCV.Managed.slnx -c Release

      - name: Test
        run: dotnet test src/Geometrikal.OpenCV.Managed.Tests/Geometrikal.OpenCV.Managed.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Geometrikal.OpenCV.Managed/Geometrikal.OpenCV.Managed.csproj -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*
